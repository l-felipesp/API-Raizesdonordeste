  /pedidos/{id}:
    get:
      tags:
      - Pedidos
      summary: Consultar pedido
      description: "Qualquer perfil autenticado. O perfil CLIENTE só consulta os pró\
        prios pedidos: o pedido de outro cliente retorna 404, sem revelar que existe."
      operationId: buscar_2
      parameters:
      - name: id
        in: path
        description: Id do pedido
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "200":
          description: Pedido encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PedidoResponse"
              examples:
                Pedido:
                  description: Pedido
                  value:
                    id: 10
                    canalPedido: APP
                    status: EM_PREPARO
                    total: 25.0
                    criadoEm: 2026-10-09T10:00:00
                    itens:
                    - produtoId: 1
                      nomeProduto: Tapioca de Queijo Coalho
                      quantidade: 2
                      precoUnitario: 12.5
                      subtotal: 25.0
                    pagamento:
                      status: APROVADO
                      formaPagamento: PIX
        "401":
          description: "Token ausente, inválido ou expirado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Sem token:
                  description: Sem token
                  value:
                    error: NAO_AUTENTICADO
                    message: Autenticação necessária. Envie um token válido no header
                      Authorization.
                    details: []
                    timestamp: 2026-10-09T13:00:00Z
                    path: /pedidos
                    requestId: 3f1c2a9e-7b4d-4c1a-9f2e-1a2b3c4d5e6f
        "404":
          description: Pedido inexistente ou de outro cliente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Não encontrado:
                  description: Não encontrado
                  value:
                    error: RECURSO_NAO_ENCONTRADO
                    message: "Pedido não encontrado: id 999"
                    details: []
                    timestamp: 2026-10-09T13:00:00Z
                    path: /pedidos/999
                    requestId: 9b8a7c6d-5e4f-4a3b-9c2d-1e0f9a8b7c6d
  /auditoria:
    get:
      tags:
      - Auditoria
      summary: Consultar auditoria de um registro
      description: "Perfis GERENTE ou ADMIN. Ações registradas: PEDIDO_CRIADO, PAGAMENTO_PROCESSADO,\
        \ PAGAMENTO_RETENTADO, STATUS_ATUALIZADO, PEDIDO_CANCELADO, ESTOQUE_MOVIMENTADO,\
        \ DADOS_PESSOAIS_ACESSADOS, CONSENTIMENTO_CONCEDIDO, CONSENTIMENTO_REVOGADO\
        \ e USUARIO_ANONIMIZADO."
      operationId: consultar
      parameters:
      - name: entidade
        in: query
        description: "Tipo do registro auditado: Pedido, Estoque ou Usuario"
        required: true
        schema:
          type: string
        example: Pedido
      - name: entidadeId
        in: query
        description: Id do registro auditado
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      - name: page
        in: query
        description: "Página, começando em 1"
        required: false
        schema:
          type: integer
          format: int32
          default: 1
        example: 1
      - name: limit
        in: query
        description: "Itens por página, de 1 a 100"
        required: false
        schema:
          type: integer
          format: int32
          default: 10
        example: 10
      - name: sort
        in: query
        description: "Ordenação: campo ou campo,asc|desc. Campos: id, criadoEm"
        required: false
        schema:
          type: string
        example: "id,desc"
      responses:
        "200":
          description: Página de registros de auditoria
          content:
            application/json:
              examples:
                Auditoria de um pedido:
                  description: Auditoria de um pedido
                  value:
                    itens:
                    - id: 21
                      usuarioEmail: atendente@raizes.com
                      acao: STATUS_ATUALIZADO
                      entidade: Pedido
                      entidadeId: 10
                      detalhes: de=EM_PREPARO; para=PRONTO
                      criadoEm: 2026-10-09T10:20:00
                    - id: 18
                      usuarioEmail: cliente@raizes.com
                      acao: PEDIDO_CRIADO
                      entidade: Pedido
                      entidadeId: 10
                      detalhes: canal=APP; total=25.00; clienteId=4
                      criadoEm: 2026-10-09T10:00:00
                    page: 1
                    limit: 10
                    totalItens: 2
                    totalPaginas: 1
        "400":
          description: Paginação ou ordenação inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                page inválido:
                  description: page inválido
                  value:
                    error: PARAMETRO_INVALIDO
                    message: A página deve ser maior ou igual a 1.
                    details:
                    - field: page
                      issue: A página deve ser maior ou igual a 1.
                    timestamp: 2026-10-09T13:00:00Z
                    path: /produtos
                    requestId: 8b9c0d1e-2f3a-4b4c-9d5e-6f7a8b9c0d1e
        "401":
          description: "Token ausente, inválido ou expirado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Sem token:
                  description: Sem token
                  value:
                    error: NAO_AUTENTICADO
                    message: Autenticação necessária. Envie um token válido no header
                      Authorization.
                    details: []
                    timestamp: 2026-10-09T13:00:00Z
                    path: /pedidos
                    requestId: 3f1c2a9e-7b4d-4c1a-9f2e-1a2b3c4d5e6f
        "403":
          description: Perfil sem permissão para a operação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Perfil sem permissão:
                  description: Perfil sem permissão
                  value:
                    error: ACESSO_NEGADO
                    message: Seu perfil não possui permissão para esta operação.
                    details: []
                    timestamp: 2026-10-09T13:00:00Z
                    path: /relatorios/vendas
                    requestId: 5c4d3e2f-1a0b-4c9d-8e7f-6a5b4c3d2e1f
components:
  schemas:
    ProdutoRequest:
      type: object
      properties:
        nome:
          type: string
          example: Cuscuz de Milho com Ovo
          minLength: 1
        descricao:
          type: string
          example: Cuscuz nordestino com ovo e manteiga de garrafa
        preco:
          type: number
          example: 14.9
          minimum: 0.0
        categoria:
          type: string
          example: Salgados
        disponivelDe:
          type: string
          format: date
          description: Opcional. Início da disponibilidade de um produto sazonal (yyyy-MM-dd)
        disponivelAte:
          type: string
          format: date
          description: Opcional. Fim da disponibilidade de um produto sazonal (yyyy-MM-dd)
      required:
      - nome
      - preco
    ProdutoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        descricao:
          type: string
        preco:
          type: number
        categoria:
          type: string
        disponivelDe:
          type: string
          format: date
        disponivelAte:
          type: string
          format: date
    CampoInvalido:
      type: object
      properties:
        field:
          type: string
        issue:
          type: string
    ErroResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/CampoInvalido"
        timestamp:
          type: string
          format: date-time
        path:
          type: string
        requestId:
          type: string
    CadastroUsuarioRequest:
      type: object
      properties:
        nome:
          type: string
          example: Maria Silva
          minLength: 1
        email:
          type: string
          format: email
          example: maria@exemplo.com
          minLength: 1
        senha:
          type: string
          description: Mínimo de 8 caracteres
          example: Senha@123
          maxLength: 2147483647
          minLength: 8
        aceitaFidelizacao:
          type: boolean
          description: Opcional. Consentimento para uso dos dados no programa de fidelização
          example: true
      required:
      - email
      - nome
      - senha
    UsuarioResumoDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        perfil:
          type: string
    UnidadeRequest:
      type: object
      properties:
        nome:
          type: string
          example: Raízes Natal Ponta Negra
          minLength: 1
        cidade:
          type: string
          example: Natal
          minLength: 1
        estado:
          type: string
          example: RN
          minLength: 1
        tipo:
          type: string
          enum:
          - COMPLETA
          - REDUZIDA
          example: COMPLETA
          minLength: 1
          pattern: COMPLETA|REDUZIDA
      required:
      - cidade
      - estado
      - nome
      - tipo
    UnidadeResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        cidade:
          type: string
        estado:
          type: string
        tipo:
          type: string
    PedidoItemRequest:
      type: object
      properties:
        produtoId:
          type: integer
          format: int64
          example: 1
        quantidade:
          type: integer
          format: int32
          example: 2
          minimum: 1
      required:
      - produtoId
    PedidoRequest:
      type: object
      properties:
        unidadeId:
          type: integer
          format: int64
          example: 1
        canalPedido:
          type: string
          enum:
          - APP
          - TOTEM
          - BALCAO
          - PICKUP
          - WEB
          example: APP
        clienteId:
          type: integer
          format: int64
          description: Opcional. Usado pelo ATENDENTE para registrar o pedido em nome
            de um cliente cadastrado
          example: 4
        itens:
          type: array
          items:
            $ref: "#/components/schemas/PedidoItemRequest"
          minItems: 1
        formaPagamento:
          type: string
          description: "Mock: PAGAMENTO_INDISPONIVEL simula falha de comunicação com\
            \ o gateway"
          example: PIX
          minLength: 1
      required:
      - canalPedido
      - formaPagamento
      - itens
      - unidadeId
    ItemPedidoResponse:
      type: object
      properties:
        produtoId:
          type: integer
          format: int64
        nomeProduto:
          type: string
        quantidade:
          type: integer
          format: int32
        precoUnitario:
          type: number
        subtotal:
          type: number
    PagamentoResponse:
      type: object
      properties:
        status:
          type: string
        formaPagamento:
          type: string
    PedidoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        canalPedido:
          type: string
          enum:
          - APP
          - TOTEM
          - BALCAO
          - PICKUP
          - WEB
        status:
          type: string
          enum:
          - AGUARDANDO_PAGAMENTO
          - EM_PREPARO
          - PRONTO
          - ENTREGUE
          - CANCELADO
          - PAGAMENTO_RECUSADO
        total:
          type: number
        criadoEm:
          type: string
          format: date-time
        itens:
          type: array
          items:
            $ref: "#/components/schemas/ItemPedidoResponse"
        pagamento:
          $ref: "#/components/schemas/PagamentoResponse"
    RetentarPagamentoRequest:
      type: object
      properties:
        formaPagamento:
          type: string
          example: PIX
          minLength: 1
      required:
      - formaPagamento
    EstoqueRequest:
      type: object
      properties:
        unidadeId:
          type: integer
          format: int64
          example: 3
        produtoId:
          type: integer
          format: int64
          example: 7
        quantidadeInicial:
          type: integer
          format: int32
          example: 20
          minimum: 0
      required:
      - produtoId
      - unidadeId
    EstoqueResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        unidadeId:
          type: integer
          format: int64
        produtoId:
          type: integer
          format: int64
        nomeProduto:
          type: string
        quantidade:
          type: integer
          format: int32
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: cliente@raizes.com
          minLength: 1
        senha:
          type: string
          example: Senha@123
          minLength: 1
      required:
      - email
      - senha
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
          format: int64
        user:
          $ref: "#/components/schemas/UsuarioResumoDTO"
    ConsentimentoRequest:
      type: object
      properties:
        aceitaFidelizacao:
          type: boolean
          description: true concede e false revoga o consentimento
          example: false
      required:
      - aceitaFidelizacao
    UsuarioDetalheResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        email:
          type: string
        perfil:
          type: string
        criadoEm:
          type: string
          format: date-time
        consentimentoFidelizacao:
          type: boolean
        consentimentoFidelizacaoEm:
          type: string
          format: date-time
    AtualizarStatusRequest:
      type: object
      properties:
        novoStatus:
          type: string
          enum:
          - AGUARDANDO_PAGAMENTO
          - EM_PREPARO
          - PRONTO
          - ENTREGUE
          - CANCELADO
          - PAGAMENTO_RECUSADO
          example: PRONTO
      required:
      - novoStatus
    MovimentacaoEstoqueRequest:
      type: object
      properties:
        tipo:
          type: string
          enum:
          - ENTRADA
          - SAIDA
          example: ENTRADA
        quantidade:
          type: integer
          format: int32
          example: 10
          minimum: 1
      required:
      - tipo
    ProdutoMaisVendido:
      type: object
      properties:
        produtoId:
          type: integer
          format: int64
        produto:
          type: string
        quantidadeVendida:
          type: integer
          format: int64
        faturamento:
          type: number
    RelatorioVendasResponse:
      type: object
      properties:
        inicio:
          type: string
          format: date
        fim:
          type: string
          format: date
        totalPedidos:
          type: integer
          format: int64
        faturamentoTotal:
          type: number
        vendasPorUnidade:
          type: array
          items:
            $ref: "#/components/schemas/VendaPorUnidade"
        vendasPorEstado:
          type: array
          items:
            $ref: "#/components/schemas/VendaPorEstado"
        produtosMaisVendidos:
          type: array
          items:
            $ref: "#/components/schemas/ProdutoMaisVendido"
    VendaPorEstado:
      type: object
      properties:
        estado:
          type: string
        quantidadePedidos:
          type: integer
          format: int64
        faturamento:
          type: number
    VendaPorUnidade:
      type: object
      properties:
        unidadeId:
          type: integer
          format: int64
        unidade:
          type: string
        estado:
          type: string
        quantidadePedidos:
          type: integer
          format: int64
        faturamento:
          type: number
  securitySchemes:
    bearerAuth:
      type: http
      name: bearerAuth
      scheme: bearer
      bearerFormat: JWT
