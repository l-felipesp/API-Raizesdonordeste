openapi: 3.1.0
info:
  title: Raízes do Nordeste — API Back-end
  description: |
    API REST do fluxo de pedidos, estoque e pagamento mock da rede Raízes do Nordeste. Trilha Back-end — Projeto Multidisciplinar.

    **Como autenticar:** chame `POST /auth/login`, copie o `accessToken` da resposta, clique em **Authorize** e cole o token (sem a palavra Bearer). Endpoints sem cadeado são públicos.

    **Usuários do seed** (senha `Senha@123` para todos): `admin@raizes.com` (ADMIN), `gerente@raizes.com` (GERENTE), `atendente@raizes.com` (ATENDENTE) e `cliente@raizes.com` (CLIENTE).

    **Pagamento mock:** total a partir de R$ 500,00 é recusado; `formaPagamento` igual a `PAGAMENTO_INDISPONIVEL` simula falha de comunicação com o gateway; os demais casos são aprovados.

    **Listagens:** paginadas com `page` (a partir de 1), `limit` (1 a 100) e `sort` (`campo` ou `campo,asc|desc`).

    **Erros:** todas as falhas seguem o mesmo formato JSON, com `error`, `message`, `details`, `timestamp`, `path` e `requestId`.
  version: v1
servers:
- url: http://localhost:8080
  description: Generated server url
security:
- bearerAuth: []
tags:
- name: Produtos
  description: Cadastro de produtos
- name: Pedidos
  description: "Fluxo crítico: pedido, pagamento mock e status"
- name: Estoque
  description: Controle de estoque por unidade
- name: Relatórios
  description: Indicadores de vendas para a matriz
- name: Autenticação
  description: Login e emissão de token JWT
- name: Unidades
  description: Unidades da rede e cardápio por unidade
- name: Usuários
  description: Cadastro de clientes e direitos do titular (LGPD)
- name: Auditoria
  description: Consulta de logs de ações sensíveis
paths:
  /produtos/{id}:
    get:
      tags:
      - Produtos
      summary: Consultar produto
      description: Público.
      operationId: buscar
      parameters:
      - name: id
        in: path
        description: Id do produto
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "200":
          description: Produto encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProdutoResponse"
              examples:
                Produto:
                  description: Produto
                  value:
                    id: 1
                    nome: Tapioca de Queijo Coalho
                    descricao: Tapioca recheada com queijo coalho
                    preco: 12.5
                    categoria: Salgados
                    disponivelDe: null
                    disponivelAte: null
                Produto sazonal:
                  description: Produto sazonal
                  value:
                    id: 7
                    nome: Canjica Junina
                    descricao: Canjica de milho com canela
                    preco: 11.9
                    categoria: Doces
                    disponivelDe: 2026-06-01
                    disponivelAte: 2026-07-31
        "404":
          description: Produto inexistente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Não encontrado:
                  description: Não encontrado
                  value:
                    error: RECURSO_NAO_ENCONTRADO
                    message: "Produto não encontrado: id 999"
                    details: []
                    timestamp: 2026-10-09T13:00:00Z
                    path: /pedidos
                    requestId: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
      security: []
    put:
      tags:
      - Produtos
      summary: Atualizar produto
      description: Perfis GERENTE ou ADMIN.
      operationId: atualizar
      parameters:
      - name: id
        in: path
        description: Id do produto
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProdutoRequest"
        required: true
      responses:
        "200":
          description: Produto atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProdutoResponse"
              examples:
                Produto:
                  description: Produto
                  value:
                    id: 1
                    nome: Tapioca de Queijo Coalho
                    descricao: Tapioca recheada com queijo coalho
                    preco: 12.5
                    categoria: Salgados
                    disponivelDe: null
                    disponivelAte: null
        "400":
          description: Corpo malformado ou valor de enum inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                JSON inválido:
                  description: JSON inválido
                  value:
                    error: REQUISICAO_INVALIDA
                    message: Corpo da requisição malformado ou com valor não aceito
                      (verifique enums como canalPedido).
                    details: []
                    timestamp: 2026-10-09T13:00:00Z
                    path: /pedidos
                    requestId: 7a8b9c0d-1e2f-4a3b-8c4d-5e6f7a8b9c0d
        "401":
          description: "Token ausente, inválido ou expirado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Sem token:
                  description: Sem token
                  value:
                    error: NAO_AUTENTICADO
                    message: Autenticação necessária. Envie um token válido no header
                      Authorization.
                    details: []
                    timestamp: 2026-10-09T13:00:00Z
                    path: /pedidos
                    requestId: 3f1c2a9e-7b4d-4c1a-9f2e-1a2b3c4d5e6f
        "403":
          description: Perfil sem permissão para a operação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Perfil sem permissão:
                  description: Perfil sem permissão
                  value:
                    error: ACESSO_NEGADO
                    message: Seu perfil não possui permissão para esta operação.
                    details: []
                    timestamp: 2026-10-09T13:00:00Z
                    path: /relatorios/vendas
                    requestId: 5c4d3e2f-1a0b-4c9d-8e7f-6a5b4c3d2e1f
        "404":
          description: Produto inexistente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Não encontrado:
                  description: Não encontrado
                  value:
                    error: RECURSO_NAO_ENCONTRADO
                    message: "Produto não encontrado: id 999"
                    details: []
                    timestamp: 2026-10-09T13:00:00Z
                    path: /pedidos
                    requestId: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
        "422":
          description: Campos obrigatórios ausentes ou com formato inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Validação:
                  description: Validação
                  value:
                    error: VALIDACAO_FALHOU
                    message: Um ou mais campos são inválidos.
                    details:
                    - field: canalPedido
                      issue: não deve ser nulo
                    - field: "itens[0].quantidade"
                      issue: deve ser maior que ou igual à 1
                    timestamp: 2026-10-09T13:00:00Z
                    path: /pedidos
                    requestId: 4d5e6f7a-8b9c-4d0e-9f1a-2b3c4d5e6f7a
