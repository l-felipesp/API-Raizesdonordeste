  /pedidos:
    get:
      tags:
      - Pedidos
      summary: Listar pedidos
      description: Qualquer perfil autenticado. Filtros opcionais por canalPedido
        e status. O perfil CLIENTE vê apenas os próprios pedidos.
      operationId: listar_2
      parameters:
      - name: canalPedido
        in: query
        description: Filtra pelo canal de origem
        required: false
        schema:
          type: string
          enum:
          - APP
          - TOTEM
          - BALCAO
          - PICKUP
          - WEB
        example: APP
      - name: status
        in: query
        description: Filtra pelo status
        required: false
        schema:
          type: string
          enum:
          - AGUARDANDO_PAGAMENTO
          - EM_PREPARO
          - PRONTO
          - ENTREGUE
          - CANCELADO
          - PAGAMENTO_RECUSADO
        example: EM_PREPARO
      - name: page
        in: query
        description: "Página, começando em 1"
        required: false
        schema:
          type: integer
          format: int32
          default: 1
        example: 1
      - name: limit
        in: query
        description: "Itens por página, de 1 a 100"
        required: false
        schema:
          type: integer
          format: int32
          default: 10
        example: 10
      - name: sort
        in: query
        description: "Ordenação: campo ou campo,asc|desc. Campos: id, criadoEm, total,\
          \ status, canalPedido"
        required: false
        schema:
          type: string
        example: "criadoEm,desc"
      responses:
        "200":
          description: Página de pedidos
          content:
            application/json:
              examples:
                Pedidos:
                  description: Pedidos
                  value:
                    itens:
                    - id: 10
                      canalPedido: APP
                      status: EM_PREPARO
                      total: 25.0
                      criadoEm: 2026-10-09T10:00:00
                      itens:
                      - produtoId: 1
                        nomeProduto: Tapioca de Queijo Coalho
                        quantidade: 2
                        precoUnitario: 12.5
                        subtotal: 25.0
                      pagamento:
                        status: APROVADO
                        formaPagamento: PIX
                    page: 1
                    limit: 10
                    totalItens: 1
                    totalPaginas: 1
        "400":
          description: "Filtro, paginação ou ordenação inválidos"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Status inválido:
                  description: Status inválido
                  value:
                    error: PARAMETRO_INVALIDO
                    message: Parâmetro com valor ou formato inválido.
                    details:
                    - field: status
                      issue: "Valor 'XYZ' inválido. Valores aceitos: [AGUARDANDO_PAGAMENTO,\
                        \ EM_PREPARO, PRONTO, ENTREGUE, CANCELADO, PAGAMENTO_RECUSADO]"
                    timestamp: 2026-10-09T13:00:00Z
                    path: /pedidos
                    requestId: 9c0d1e2f-3a4b-4c5d-8e6f-7a8b9c0d1e2f
                page inválido:
                  description: page inválido
                  value:
                    error: PARAMETRO_INVALIDO
                    message: A página deve ser maior ou igual a 1.
                    details:
                    - field: page
                      issue: A página deve ser maior ou igual a 1.
