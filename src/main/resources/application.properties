spring.application.name=backend

# Carrega as variaveis locais do arquivo .env (nao versionado). Ver .env.example.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/raizes_nordeste}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# O schema e criado e versionado pelo Flyway; o Hibernate apenas VALIDA
# se as entidades batem com o banco (se divergirem, a API nao sobe).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# db/migration = estrutura (sempre); db/seed = dados de teste (desligar em producao)
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/seed}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

spring.jackson.serialization.write-dates-as-timestamps=false

# Disponibilidade: expoe apenas o health check (inclui a conexao com o banco), sem detalhes internos
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
